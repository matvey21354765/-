[build]
builder = "NIXPACKS"
buildCommand = "python3 -m venv /app/venv && /app/venv/bin/pip install -r requirements.txt && /app/venv/bin/python -m playwright install chromium"

[deploy]
startCommand = "/app/venv/bin/python control_bot.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
